# Publishes the browser-only build to GitHub Pages on every push to main.
# One-time setup: repo Settings > Pages > Source = "GitHub Actions".
name: Deploy static site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install backend dependencies (used only to export the content)
        run: pip install -r backend/requirements.txt
      - name: Export content to static JSON
        run: python scripts/export_static.py
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Test and lint
        run: |
          npm run typecheck
          npm run lint
          npm test
        working-directory: frontend
      - name: Build static site
        run: npm run build:static
        working-directory: frontend
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
